name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PIP_NO_BUILD_ISOLATION: "1"
      PYTHONPATH: /tmp/py_shim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          mkdir -p /tmp/py_shim
          cat << 'EOF' > /tmp/py_shim/cgi.py
          def parse_header(line, pdict=None):
              return line, pdict or {}
          EOF
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "cython>=3.0.11" buildozer virtualenv

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-py311-direct-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: bin/*.apk
