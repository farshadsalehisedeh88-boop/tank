name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          python -m pip install --upgrade pip setuptools wheel cython virtualenv
          python -m pip install "git+https://github.com/kivy/buildozer.git@master"

      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Save log tail
        if: always()
        run: tail -n 400 build.log > build-tail.txt || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-tail.txt
            build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: bin/*.apk
